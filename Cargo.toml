[workspace]

[package]
name = "metal_renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", features = ["jpeg"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"
core-graphics = "0.25"
metal = "0.33.0"
gltf = "1.4.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
